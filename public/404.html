<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #0F0F0F;
      --border: #212121;
      --text: #FFFFFF;
      --muted: #666670;
      --muted-2: #AFAFB6;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
      gap: 0;
    }

    .logo {
      height: 28px;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .code {
      font-size: 80px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--muted);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 560;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--muted-2);
      margin-bottom: 32px;
    }

    a.btn {
      display: inline-block;
      background: #fff;
      color: #0F0F0F;
      font-size: 14px;
      font-weight: 560;
      letter-spacing: -0.01em;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    a.btn:hover { opacity: 0.85; }

    .social-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 32px;
    }

    .social-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .social-link {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.65;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .social-link:hover { opacity: 1; transform: translateY(-1px); }

    .social-link img { width: 20px; height: 20px; display: block; }
  </style>
</head>
<body>

    <div class="social-links">

        <img src="./images/instagram.svg" alt="" />
      </a>
      <a class="social-link" href="https://www.tiktok.com/@trycontles" target="_blank" rel="noopener noreferrer" aria-label="Contles on TikTok">

</html>
