  <style>
    :root {
      --bg: #0F0F0F;
      --panel: #0B0B0C;
      --panel-2: #141414;
      --border: #212121;
      --border-focus: #313131;
      --text: #FFFFFF;
      --muted: #666670;
      --muted-2: #AFAFB6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Neue Montreal', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 0 8px;
    }

    input,
    textarea,
    button,
    select,
    a {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    a:focus,
    a:visited,
    a:active {
      outline: none;
    }

    img::selection {
      background-color: rgba(0, 0, 0, 0);
    }

    ::selection {
      background-color: rgba(255, 255, 255, 0.125);
    }

    ::-moz-selection {
      background-color: rgba(255, 255, 255, 0.125);
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background-color: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--border);
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--border);
    }

    img,
    video {
      pointer-events: none;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: fit-content;
      justify-content: center;
      margin-top: 128px;
      width: 100%;
    }

    #form-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .text-mobile-container {
      width: 100%;
      max-width: 520px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .brand-logo {
      width: auto;
      height: 36px;
      object-fit: cover;
      margin-bottom: 42px;
    }

    h1 {
      color: var(--text);
      text-align: center;
      font-size: 28px;
      font-weight: 550;
      line-height: 120%;
      letter-spacing: -0.5px;
      margin: 0;
      margin-bottom: 42px;
      width: 100%;
    }

    .hero-title {
      background-image: linear-gradient(
        to top right,
        #8C31D5 0%,
        #FB5F5F 100%
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      font-weight: 400;
      line-height: normal;
      letter-spacing: 0.005em;
    }

    html.js .anim-logo,
    html.js .anim-title,
    html.js .anim-launch {
      opacity: 0;
      transform: translateY(16px);
      filter: blur(10px);
      will-change: transform, opacity, filter;
    }

    html.js .anim-input,
    html.js .anim-button {
      opacity: 0;
      transform: translateY(16px);
      filter: blur(7px);
      will-change: transform, opacity, filter;
    }

    html.js .anim-carousel {
      opacity: 0;
      transform: translateY(16px);
      filter: blur(9px);
      will-change: transform, opacity, filter;
    }

    @media (prefers-reduced-motion: reduce) {
      html.js .anim-logo,
      html.js .anim-title,
      html.js .anim-input,
      html.js .anim-button,
      html.js .anim-launch,
      html.js .anim-carousel {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    input {
      width: 100%;
      max-width: 300px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      box-sizing: border-box;
      padding-left: 14px;
      color: var(--text);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s ease;
    }

    input::placeholder {
      color: var(--muted-2);
      opacity: 1;
    }

    input:focus {
      outline: none;
      border-color: var(--border-focus);
      background: #18181b;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s ease;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px var(--panel-2) inset !important;
      box-shadow: 0 0 0 1000px var(--panel-2) inset !important;
      -webkit-text-fill-color: #fff !important;
      color: #fff !important;
      border-color: var(--border-focus) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .sub-button {
      width: 100%;
      max-width: 300px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      border: none;
      margin: 0;
      transition: background-color 0.2s ease;
    }

    .sub-button:hover {
      background: #dfdfe4;
    }

    .sub-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #error-message {
      display: none;
      width: 100%;
      margin-top: 12px;
      font-size: 14px;
      color: #ff6b6b;
      text-align: center;
    }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 92px;
      margin-bottom: 92px;
      gap: 16px;
    }

    #carousel-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 1440/890;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #18181b;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .carousel-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .carousel-image.active {
      opacity: 1;
      z-index: 1;
    }

    .success {
      display: none;
      position: fixed;
      inset: 0;
      background: #0F0F0F;
      backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
    }

    .success[style*="display: block"] {
      display: flex !important;
    }

    .success img {
      width: 100%;
      max-width: 420px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      background: #18181b;
    }

    .success h1 {
      margin-bottom: 12px;
    }

    .success p {
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .page {
        margin-top: 92px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="form-wrapper">
      <div class="text-mobile-container">
        <img src="/images/contles-big.svg" alt="Contles logo" class="brand-logo anim-logo" />

        <h1 class="anim-title" style="max-width: 320px; text-transform: capitalize;">We're building the future of <span class="hero-title">creator marketing</span></h1>

        <form id="waitlist-form" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
          <input type="text" name="fields[name]" id="name-input" class="anim-input" placeholder="Name" required style="font-weight: 500; letter-spacing: -0.01em;"/>
          <input type="email" name="fields[email]" id="email-input" class="anim-input" placeholder="Email" required style="font-weight: 500; letter-spacing: -0.01em;"/>
          <button class="sub-button anim-button" type="submit" id="submit-btn" style="font-weight: 500; letter-spacing: -0.01em;">Get early access</button>
        </form>

        <div id="error-message">Something went wrong. Please try again.</div>
      </div>

      <div class="section">
        <p class="anim-launch" style="font-weight: 500; letter-spacing: -0.01em;">Launching very soon!</p>

        <div id="carousel-container" class="anim-carousel" aria-label="Product preview carousel">
          <img src="/images/1.webp" class="carousel-image" alt="Contles preview 1" />
          <img src="/images/2.webp" class="carousel-image" alt="Contles preview 2" />
          <img src="/images/3.webp" class="carousel-image" alt="Contles preview 3" />
          <img src="/images/4.webp" class="carousel-image" alt="Contles preview 4" />
          <img src="/images/5.webp" class="carousel-image" alt="Contles preview 5" />
          <img src="/images/6.webp" class="carousel-image" alt="Contles preview 6" />
          <img src="/images/7.webp" class="carousel-image" alt="Contles preview 7" />
        </div>
      </div>
    </div>

    <div class="success" id="success">
      <img id="success-gif" src="" alt="Thank you" />
      <h1 style="font-size: 40px; font-weight: 550; letter-spacing: -0.02em; line-height: 1.2;">You’re in 🚀</h1>
      <p style="font-weight: 500; letter-spacing: -0.01em;">Thankyou! We will get in touch with you soon!</p>
    </div>
  </div>

  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const form = document.getElementById("waitlist-form");
    const formWrapper = document.getElementById("form-wrapper");
    const success = document.getElementById("success");
    const successGifImg = document.getElementById("success-gif");
    const errorMessage = document.getElementById("error-message");
    const submitBtn = document.getElementById("submit-btn");
    const nameInput = document.getElementById("name-input");
    const emailInput = document.getElementById("email-input");
    
    const USE_SERVERLESS_FUNCTION = false;
    const SERVERLESS_FUNCTION_URL = "/api/subscribe";
    
    const MAILERLITE_API_KEY = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJhdWQiOiI0IiwianRpIjoiYzBhMzA2MTFmZjZlYWUwZTBlZDg3NGU3YmY2YjI1ZDY0NTVmYjIwOTg1ZjgzODc0MzM5MTk3ZWUwMmMzN2ExNWVhOWRiYWFiODE3NTZiMjMiLCJpYXQiOjE3NjU1NzA5OTEuMzA5NTQ3LCJuYmYiOjE3NjU1NzA5OTEuMzA5NTQ5LCJleHAiOjQ5MjEyNDQ1OTEuMzAzMDc2LCJzdWIiOiIxOTk3NDI3Iiwic2NvcGVzIjpbXX0.Tl6yVP8tpuYRjYcQPAKjKfN66aUYj0MGDa6Qlnczfh5RiE7NfjkGJYlzltRVaMGujirbqBOXRu61IATu0kxtsnWOs98VUQmTNj3fw0iizFJWWfEBKQIerc674UHTmHFFl0MBM9VFVmoBqueC6AzvOitqPocLpzwFXXEAWyjMhHB8tHGeAQlly0nA7SejOeT_J9cLVF7EEXAss4weEkKKaRCF1wy670udKoHAYr6YGjj8qiat6ByJa13HMKD9Jyps1qbMO6uyBNT0_tASBlZtChQ_LSl-6j4P4dYyjXDs0CXnx9w99w-O-uS0CjDr3xTmY1ZvaldA4jWxW14WKgRfBNzdaRjQFUhQtw6WKNHlT4ZQJ3RZstH_NV8xTrsvUnDBjRrAkTXJgdbDObQRfzSmiDgr0v497Ur9uIWldngT2C9i8j1-JKgIX9N0oQqYkvmqRq-Dz-UKZJafJJ99E37pjKFRlTR_bWteikKAXBfsF2rf20MdJf4QQ9HvAVeEcJyPc1DBq_4GUJLasCilVitlajKeToys553LEqSs_Du-A5cFNh0Vn0P1P7mbGOCZEfRbcAQ8MywAMsPyCwG2N76W6-z3V9sGVNH7QHUuSWOIMUty2pbIbfcJ9-dl0DoV-j-pqm3DRyNOONsJ_lwCDjHTbPBzLpZpUPmeSJzDWJO0jb0";
    const MAILERLITE_GROUP_ID = "173612830070670438";
    const MAILERLITE_API_URL = "https://connect.mailerlite.com/api/subscribers";

    const DAILY_SUCCESS_GIFS = [
      "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif",
      "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
      "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
    ];

    function getDayOfYear(date = new Date()) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff =
        date - start +
        (start.getTimezoneOffset() - date.getTimezoneOffset()) * 60 * 1000;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function pickDailySuccessGifUrl() {
      const day = getDayOfYear();
      return DAILY_SUCCESS_GIFS[day % DAILY_SUCCESS_GIFS.length];
    }

    function setDailySuccessGif() {
      if (!successGifImg) return;
      const url = pickDailySuccessGifUrl();
      successGifImg.src = url;
      successGifImg.loading = "lazy";
      successGifImg.decoding = "async";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      errorMessage.style.display = "none";
      
      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = "Submitting...";

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();

      if (!name || !email) {
        showError("Please fill in all fields.");
        return;
      }

      try {
        let response, data;

        if (USE_SERVERLESS_FUNCTION) {
          response = await fetch(SERVERLESS_FUNCTION_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email,
              name: name
            })
          });
          data = await response.json();
        } else {
          response = await fetch(MAILERLITE_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${MAILERLITE_API_KEY}`,
              "Accept": "application/json"
            },
            body: JSON.stringify({
              email: email,
              fields: {
                name: name
              },
              groups: [MAILERLITE_GROUP_ID]
            })
          });
          data = await response.json();
        }

        if (response.ok) {
          showSuccess();
        } else {

          if (data.error || data.message) {
            const errorMsg = data.error || data.message;
            if (errorMsg.includes("already exists") || response.status === 200) {
              showSuccess();
            } else {
              showError(errorMsg || "Failed to subscribe. Please try again.");
            }
          } else {
            showError("Failed to subscribe. Please try again.");
          }
        }
      } catch (error) {
        console.error("Submission error:", error);
        showError("Network error. Please check your connection and try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    function showSuccess() {
      formWrapper.style.display = "none";
      success.style.display = "block";
      setDailySuccessGif();
      form.reset();
    }

    function showError(message = "Something went wrong. Please try again.") {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }

    const carouselImages = document.querySelectorAll('#carousel-container .carousel-image');
    let carouselIndex = 0;

    function showCarouselImage(idx) {
      carouselImages.forEach((img, i) => {
        if (i === idx) {
          img.classList.add('active');
        } else {
          img.classList.remove('active');
        }
      });
    }

    if (carouselImages.length > 0) {
      showCarouselImage(carouselIndex);
      setInterval(() => {
        carouselIndex = (carouselIndex + 1) % carouselImages.length;
        showCarouselImage(carouselIndex);
      }, 1000);
    }

    const prefersReducedMotion =
      window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!prefersReducedMotion && window.gsap) {
      window.gsap.set(
        [".anim-logo", ".anim-title", ".anim-input", ".anim-button", ".anim-launch", ".anim-carousel"],
        { autoAlpha: 0, y: 16 }
      );
      window.gsap.set([".anim-logo", ".anim-title", ".anim-launch"], { filter: "blur(10px)" });
      window.gsap.set([".anim-input", ".anim-button"], { filter: "blur(6px)" });
      window.gsap.set([".anim-carousel"], { filter: "blur(9px)" });
      document.documentElement.classList.remove("js");

      const flow = [
        ".anim-logo",
        ".anim-title",
        "#name-input.anim-input",
        "#email-input.anim-input",
        ".anim-button",
        ".anim-launch",
        ".anim-carousel"
      ];

      window.gsap.to(flow, {
        autoAlpha: 1,
        y: 0,
        filter: "blur(0px)",
        duration: 0.75,
        ease: "power3.out",
        stagger: 0.14,
        force3D: true
      });
    } else {
      document.documentElement.classList.remove('js');
    }
  </script>

</body>
</html>
