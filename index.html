  <style>
    :root {
      --bg: #0F0F0F;
      --panel: #0B0B0C;
      --panel-2: #141414;
      --border: #212121;
      --border-focus: #313131;
      --text: #FFFFFF;
      --muted: #666670;
      --muted-2: #AFAFB6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: Inter, 'Neue Montreal', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 0 8px;
    }

    @supports (font-variation-settings: normal) {
      body {
        font-family: "Inter var", Inter, 'Neue Montreal', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
    }

    input,
    textarea,
    button,
    select,
    a {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    a:focus,
    a:visited,
    a:active {
      outline: none;
    }

    img::selection {
      background-color: rgba(0, 0, 0, 0);
    }

    ::selection {
      background-color: rgba(255, 255, 255, 0.125);
    }

    ::-moz-selection {
      background-color: rgba(255, 255, 255, 0.125);
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background-color: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--border);
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--border);
    }

    img,
    video {
      pointer-events: none;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: fit-content;
      justify-content: center;
      margin-top: 128px;
      width: 100%;
    }

    #form-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .text-mobile-container {
      width: 100%;
      max-width: 520px;
      padding: 0 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .brand-logo {
      width: auto;
      height: 42px;
      object-fit: cover;
      margin-bottom: 42px;
    }

    h1 {
      color: var(--text);
      text-align: center;
      font-size: 28px;
      font-weight: 550;
      line-height: 120%;
      letter-spacing: -0.02em;
      margin: 0;
      margin-bottom: 42px;
      width: 100%;
    }

    .hero-title {
      background-image: linear-gradient(
        to top right,
        #5F0EEC 0%,
        #FC6262 100%
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      font-weight: 400;
      line-height: normal;
      letter-spacing: 0.005em;
    }

    html.js .anim-logo,
    html.js .anim-title,
    html.js .anim-launch {
      opacity: 0;
      transform: translateY(16px);
      filter: blur(10px);
      will-change: transform, opacity, filter;
    }

    html.js .anim-input,
    html.js .anim-button {
      opacity: 0;
      transform: translateY(16px);
      filter: blur(7px);
      will-change: transform, opacity, filter;
    }

    html.js .anim-carousel {
      opacity: 0;
      transform: translateY(16px);
      filter: blur(9px);
      will-change: transform, opacity, filter;
    }

    @media (prefers-reduced-motion: reduce) {
      html.js .anim-logo,
      html.js .anim-title,
      html.js .anim-input,
      html.js .anim-button,
      html.js .anim-launch,
      html.js .anim-carousel {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    input {
      width: 100%;
      max-width: 300px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      box-sizing: border-box;
      padding-left: 14px;
      color: var(--text);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s ease;
    }

    input::placeholder {
      color: var(--muted-2);
      opacity: 1;
    }

    input:focus {
      outline: none;
      border-color: var(--border-focus);
      background: #18181b;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s ease;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px var(--panel-2) inset !important;
      box-shadow: 0 0 0 1000px var(--panel-2) inset !important;
      -webkit-text-fill-color: #fff !important;
      color: #fff !important;
      border-color: var(--border-focus) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .sub-button {
      width: 100%;
      max-width: 300px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      border: none;
      margin: 0;
      transition: background-color 0.2s ease;
    }

    .sub-button:hover {
      background: #dfdfe4;
    }

    .sub-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #error-message {
      display: none;
      width: 100%;
      margin-top: 12px;
      font-size: 14px;
      color: #ff6b6b;
      text-align: center;
    }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 85px;
      margin-bottom: 92px;
      gap: 16px;
    }

    .social-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .social-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .social-link {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.75;
      transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
    }

    .social-link:hover {
      opacity: 1;
      filter: brightness(1.2);
      transform: translateY(-1px);
    }

    .social-link:active {
      transform: translateY(0);
    }

    .social-link img {
      width: 20px;
      height: 20px;
      display: block;
    }

    #carousel-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 1440/890;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #18181b;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .preview-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .success {
      display: none;
      position: fixed;
      inset: 0;
      background: #0F0F0F;
      backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
    }

    .success[style*="display: block"] {
      display: flex !important;
    }

    .success img {
      width: 100%;
      max-width: 420px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      background: #18181b;
    }

    .success h1 {
      margin-bottom: 12px;
    }

    .success p {
      color: var(--muted);
    }

    .persona-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      overflow: hidden;
    }

    .persona-modal[hidden] {
      display: none !important;
    }

    .persona-modal::before,
    .persona-modal::after {
      content: "";
      position: absolute;
      inset: -25%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 260ms ease, transform 520ms cubic-bezier(0.2, 0.9, 0.2, 1), filter 520ms ease;
      transform: translate3d(0, 0, 0) scale(1.03);
      filter: blur(18px) saturate(1.1);
      will-change: opacity, transform, filter;
    }

    /* Brand wash (purple) */
    .persona-modal::before {
      background:
        radial-gradient(900px 520px at 20% 15%, rgba(95, 14, 236, 0.36), rgba(95, 14, 236, 0.00) 62%),
        radial-gradient(820px 540px at 85% 85%, rgba(95, 14, 236, 0.14), rgba(95, 14, 236, 0.00) 64%),
        radial-gradient(720px 420px at 60% 10%, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.00) 60%);
    }

    /* Creator wash (red) */
    .persona-modal::after {
      background:
        radial-gradient(900px 520px at 80% 15%, rgba(252, 98, 98, 0.34), rgba(252, 98, 98, 0.00) 62%),
        radial-gradient(860px 560px at 15% 85%, rgba(252, 98, 98, 0.14), rgba(252, 98, 98, 0.00) 64%),
        radial-gradient(720px 420px at 40% 10%, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.00) 60%);
    }

    /* Hover state is applied via JS (mouseenter/focus) */
    .persona-modal.hover-brand::before {
      opacity: 1;
      transform: translate3d(0, -0.5%, 0) scale(1.05);
      filter: blur(14px) saturate(1.2);
      animation: personaWashDrift 7s ease-in-out infinite alternate;
    }

    .persona-modal.hover-brand::after {
      opacity: 0.32;
      transform: translate3d(0.3%, 0.2%, 0) scale(1.04);
    }

    .persona-modal.hover-creator::after {
      opacity: 1;
      transform: translate3d(0, -0.5%, 0) scale(1.05);
      filter: blur(14px) saturate(1.2);
      animation: personaWashDrift 7s ease-in-out infinite alternate;
    }

    .persona-modal.hover-creator::before {
      opacity: 0.32;
      transform: translate3d(-0.3%, 0.2%, 0) scale(1.04);
    }

    .persona-modal.is-open {
      animation: personaOverlayIn 520ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }

    .persona-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: #0b0b0c;
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 22px 70px rgba(0, 0, 0, 0.60),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }

    .persona-modal.is-open .persona-card {
      animation: personaCardIn 560ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }

    /* Subtle animated gradient border (falls back gracefully) */
    .persona-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      opacity: 0.55;
      filter: blur(10px);
      transform: translateZ(0);
      animation: personaGlowSpin 6s linear infinite;
      pointer-events: none;
    }

    .persona-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(800px 220px at 50% 0%, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.0) 60%),
        radial-gradient(520px 260px at 10% 10%, rgba(95, 14, 236, 0.08), rgba(95, 14, 236, 0.0) 55%),
        radial-gradient(520px 260px at 90% 10%, rgba(252, 98, 98, 0.06), rgba(252, 98, 98, 0.0) 55%);
      pointer-events: none;
    }

    .persona-title {
      text-align: center;
      font-size: 18px;
      font-weight: 550;
      letter-spacing: -0.01em;
      color: #eaeaf0;
      position: relative;
      z-index: 1;
    }

    .persona-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 420px) {
      .persona-buttons {
        grid-template-columns: 1fr;
      }
    }

    .persona-btn {
      position: relative;
      overflow: hidden;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #18181b 0%, #131316 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 550;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    #persona-brand {
      --btn-r: 95;
      --btn-g: 14;
      --btn-b: 236;
    }

    #persona-creator {
      --btn-r: 252;
      --btn-g: 98;
      --btn-b: 98;
    }

    .persona-btn::before {
      content: "";
      position: absolute;
      inset: -1px;
      background:
        radial-gradient(260px 120px at 20% 20%, rgba(var(--btn-r, 255), var(--btn-g, 255), var(--btn-b, 255), 0.35), rgba(var(--btn-r, 255), var(--btn-g, 255), var(--btn-b, 255), 0.00) 70%),
        radial-gradient(260px 120px at 80% 80%, rgba(var(--btn-r, 255), var(--btn-g, 255), var(--btn-b, 255), 0.22), rgba(var(--btn-r, 255), var(--btn-g, 255), var(--btn-b, 255), 0.00) 70%);
      opacity: 0;
      transition: opacity 200ms ease;
      pointer-events: none;
    }

    .persona-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.00));
      opacity: 0.7;
      pointer-events: none;
    }

    .persona-btn > * {
      position: relative;
      z-index: 1;
    }

    .persona-modal.is-open .persona-btn {
      opacity: 0;
      transform: translateY(10px);
      animation: personaButtonIn 520ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
      animation-delay: 220ms;
    }

    .persona-modal.is-open .persona-btn:nth-child(2) {
      animation-delay: 300ms;
    }

    .persona-btn:hover {
      border-color: #2b2b2b;
      background: linear-gradient(180deg, #1c1c20 0%, #151519 100%);
      transform: translateY(-1px);
    }

    .persona-btn:hover::before,
    .persona-btn:focus-visible::before {
      opacity: 1;
    }

    #persona-brand:hover,
    #persona-brand:focus-visible {
      border-color: rgba(95, 14, 236, 0.55);
      box-shadow:
        0 12px 34px rgba(95, 14, 236, 0.22),
        0 0 0 1px rgba(95, 14, 236, 0.18) inset;
    }

    #persona-creator:hover,
    #persona-creator:focus-visible {
      border-color: rgba(252, 98, 98, 0.55);
      box-shadow:
        0 12px 34px rgba(252, 98, 98, 0.22),
        0 0 0 1px rgba(252, 98, 98, 0.18) inset;
    }

    .persona-btn:active {
      transform: translateY(0);
    }

    .persona-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
      border-color: #3b3b3b;
    }

    @keyframes personaOverlayIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes personaCardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes personaButtonIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes personaGlowSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes personaWashDrift {
      from {
        transform: translate3d(-0.4%, -0.2%, 0) scale(1.05);
      }
      to {
        transform: translate3d(0.4%, 0.2%, 0) scale(1.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .persona-modal.is-open,
      .persona-modal.is-open .persona-card,
      .persona-modal.is-open .persona-btn,
      .persona-card::before,
      .persona-modal::before,
      .persona-modal::after {
        animation: none !important;
      }

      .persona-modal::before,
      .persona-modal::after {
        transition: none !important;
      }
    }

    @media (max-width: 600px) {
      .page {
        margin-top: 92px;
      }
    }
  </style>
</head>

          <input type="text" name="fields[name]" id="name-input" class="anim-input" placeholder="Name" required style="font-weight: 500; letter-spacing: -0.01em;"/>
          <input type="email" name="fields[email]" id="email-input" class="anim-input" placeholder="Email" required style="font-weight: 500; letter-spacing: -0.01em;"/>
          <button class="sub-button anim-button" type="submit" id="submit-btn" style="font-weight: 520; letter-spacing: 0em; padding-top: 1px;">Join Today</button>
        </form>

        <div id="error-message">Something went wrong. Please try again.</div>
      </div>

      <div class="section">
        <div class="social-row anim-launch">
          <p style="font-weight: 500; letter-spacing: -0.01em; color: #808080">Follow us on</p>
          <div class="social-links">
            <a class="social-link" href="https://www.instagram.com/trycontles/" target="_blank" rel="noopener noreferrer" aria-label="Contles on Instagram">
              <img src="./images/instagram.svg" alt="" />
            </a>
            <a class="social-link" href="https://www.tiktok.com/@trycontles" target="_blank" rel="noopener noreferrer" aria-label="Contles on TikTok">
              <img src="./images/tiktok.svg" alt="" />
            </a>
            <a class="social-link" href="http://x.com/trycontles" target="_blank" rel="noopener noreferrer" aria-label="Contles on X">
              <img src="./images/x.svg" alt="" />
            </a>
            <a class="social-link" href="https://www.linkedin.com/company/contles/" target="_blank" rel="noopener noreferrer" aria-label="Contles on LinkedIn">
              <img src="./images/linkedin.svg" alt="" />
            </a>
            <a class="social-link" href="https://www.facebook.com/profile.php?id=61585310110358" target="_blank" rel="noopener noreferrer" aria-label="Contles on Facebook">
              <img src="./images/facebook.svg" alt="" />
            </a>
          </div>
        </div>

        <div id="carousel-container" class="anim-carousel" aria-label="Product preview">
          <img
            id="hero-image"
            src=""
            class="preview-image"
            alt="Contles product preview"
            loading="lazy"
            decoding="async"
          />
        </div>
      </div>
    </div>

    <div class="success" id="success">
      <img id="success-gif" src="" alt="Thank you" />
      <h1 style="font-size: 40px; font-weight: 550; letter-spacing: -0.02em; line-height: 1.2;">You’re in 🚀</h1>
      <p style="font-weight: 500; letter-spacing: -0.01em;">Thankyou! We will get in touch with you soon!</p>
    </div>
  </div>

  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const PERSONA_STORAGE_KEY = "contlesPersona";
    const PERSONA = {
      BRAND: "brand",
      CREATOR: "creator"
    };

    // Edit these values anytime (and set your MailerLite creator group on <body data-mailerlite-group-creator="...">).
    const PERSONA_COPY = {
      [PERSONA.BRAND]: {
        title: "Master creator marketing with Contles",
        subtitle: "Contles is being developed! Join to understand and master creator marketing + get early access!",
        logoSrc: "./images/brands.svg",
        logoAlt: "Contles logo",
        imageSrc: "./images/limonadas.webp",
        imageAlt: "Contles preview for brands",
        pageTitle: "Contles for Brands"
      },
      [PERSONA.CREATOR]: {
        title: "Become a better creator with Contles",
        subtitle: "Contles is being developed! Join to get weekly mail on how to be a better creator + get early access!",
        logoSrc: "./images/creators.svg",
        logoAlt: "Contles logo",
        imageSrc: "./images/limonadas.webp",
        imageAlt: "Contles preview for creators",
        pageTitle: "Contles for Creators"
      }
    };

    const form = document.getElementById("waitlist-form");
    const formWrapper = document.getElementById("form-wrapper");
    const success = document.getElementById("success");
    const successGifImg = document.getElementById("success-gif");
    const errorMessage = document.getElementById("error-message");
    const submitBtn = document.getElementById("submit-btn");
    const nameInput = document.getElementById("name-input");
    const emailInput = document.getElementById("email-input");

    const personaModal = document.getElementById("persona-modal");
    const personaBrandBtn = document.getElementById("persona-brand");
    const personaCreatorBtn = document.getElementById("persona-creator");
    const siteLogo = document.getElementById("site-logo");
    const heroTitle = document.getElementById("hero-title");
    const heroSubtitle = document.getElementById("hero-subtitle");
    const heroImage = document.getElementById("hero-image");
    
    const SERVERLESS_FUNCTION_URL = "/api/subscribe";

    function getStoredPersona() {
      const personaAttr = document.documentElement.getAttribute("data-persona");
      if (personaAttr === PERSONA.BRAND || personaAttr === PERSONA.CREATOR) return personaAttr;
      return null;
    }

    function setStoredPersona(persona) {
      try {
        localStorage.setItem(PERSONA_STORAGE_KEY, persona);
      } catch (_) {}
      document.documentElement.setAttribute("data-persona", persona);
    }

    function setMetaContent(selector, content) {
      if (!content) return;
      const el = document.querySelector(selector);
      if (!el) return;
      el.setAttribute("content", content);
    }

    function applyPersona(persona) {
      const cfg = PERSONA_COPY[persona];
      if (!cfg) return;

      if (siteLogo) {
        siteLogo.src = cfg.logoSrc;
        siteLogo.alt = cfg.logoAlt;
      }
      if (heroTitle) heroTitle.textContent = cfg.title;
      if (heroSubtitle) heroSubtitle.textContent = cfg.subtitle;
      if (heroImage) {
        heroImage.src = cfg.imageSrc;
        heroImage.alt = cfg.imageAlt;
      }
      if (cfg.pageTitle) document.title = cfg.pageTitle;

      // Keep SEO-ish tags consistent with the selected persona
      setMetaContent('meta[name="description"]', cfg.subtitle);
      setMetaContent('meta[property="og:title"]', cfg.pageTitle || cfg.title);
      setMetaContent('meta[name="twitter:title"]', cfg.pageTitle || cfg.title);
      setMetaContent('meta[property="og:description"]', cfg.subtitle);
      setMetaContent('meta[name="twitter:description"]', cfg.subtitle);
    }

    function hidePersonaModal() {
      if (!personaModal) return;
      personaModal.hidden = true;
      personaModal.classList.remove("is-open");
      personaModal.classList.remove("hover-brand", "hover-creator");
      document.body.style.overflow = "";
    }

    function showPersonaModal() {
      if (!personaModal) return;
      personaModal.hidden = false;
      // Re-trigger animations even if re-opened
      personaModal.classList.remove("is-open");
      personaModal.classList.remove("hover-brand", "hover-creator");
      // eslint-disable-next-line no-unused-expressions
      personaModal.offsetHeight;
      personaModal.classList.add("is-open");
      document.body.style.overflow = "hidden";
    }

    function choosePersona(persona) {
      setStoredPersona(persona);
      applyPersona(persona);
      hidePersonaModal();
      startEntranceAnimations();
    }

    // Always ask on load
    document.documentElement.removeAttribute("data-persona");
    showPersonaModal();

    if (personaBrandBtn) personaBrandBtn.addEventListener("click", () => choosePersona(PERSONA.BRAND));
    if (personaCreatorBtn) personaCreatorBtn.addEventListener("click", () => choosePersona(PERSONA.CREATOR));

    function setPersonaHover(variant) {
      if (!personaModal) return;
      personaModal.classList.toggle("hover-brand", variant === PERSONA.BRAND);
      personaModal.classList.toggle("hover-creator", variant === PERSONA.CREATOR);
    }

    function clearPersonaHover() {
      if (!personaModal) return;
      personaModal.classList.remove("hover-brand", "hover-creator");
    }

    if (personaBrandBtn) {
      personaBrandBtn.addEventListener("mouseenter", () => setPersonaHover(PERSONA.BRAND));
      personaBrandBtn.addEventListener("mouseleave", clearPersonaHover);
      personaBrandBtn.addEventListener("focus", () => setPersonaHover(PERSONA.BRAND));
      personaBrandBtn.addEventListener("blur", clearPersonaHover);
    }
    if (personaCreatorBtn) {
      personaCreatorBtn.addEventListener("mouseenter", () => setPersonaHover(PERSONA.CREATOR));
      personaCreatorBtn.addEventListener("mouseleave", clearPersonaHover);
      personaCreatorBtn.addEventListener("focus", () => setPersonaHover(PERSONA.CREATOR));
      personaCreatorBtn.addEventListener("blur", clearPersonaHover);
    }

    const DAILY_SUCCESS_GIFS = [
      "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif",
      "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
      "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
    ];

    function getDayOfYear(date = new Date()) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff =
        date - start +
        (start.getTimezoneOffset() - date.getTimezoneOffset()) * 60 * 1000;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function pickDailySuccessGifUrl() {
      const day = getDayOfYear();
      return DAILY_SUCCESS_GIFS[day % DAILY_SUCCESS_GIFS.length];
    }

    function setDailySuccessGif() {
      if (!successGifImg) return;
      const url = pickDailySuccessGifUrl();
      successGifImg.src = url;
      successGifImg.loading = "lazy";
      successGifImg.decoding = "async";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      errorMessage.style.display = "none";
      
      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = "Submitting...";

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();

      if (!name || !email) {
        showError("Please fill in all fields.");
        return;
      }

      try {
        const activePersona = getStoredPersona() || PERSONA.BRAND;
        const response = await fetch(SERVERLESS_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, name, persona: activePersona })
        });
        const data = await response.json();

        if (response.ok) {
          showSuccess();
        } else {
          showError(data.error || data.message || "Failed to subscribe. Please try again.");
        }
      } catch (error) {
        console.error("Submission error:", error);
        showError("Network error. Please check your connection and try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    function showSuccess() {
      formWrapper.style.display = "none";
      success.style.display = "block";
      setDailySuccessGif();
      form.reset();
    }

    function showError(message = "Something went wrong. Please try again.") {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }

    const prefersReducedMotion =
      window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let entranceStarted = false;
    function startEntranceAnimations() {
      if (entranceStarted) return;
      entranceStarted = true;

      if (!prefersReducedMotion && window.gsap) {
        window.gsap.set(
          [".anim-logo", ".anim-title", ".anim-input", ".anim-button", ".anim-launch", ".anim-carousel"],
          { autoAlpha: 0, y: 16 }
        );
        window.gsap.set([".anim-logo", ".anim-title", ".anim-launch"], { filter: "blur(10px)" });
        window.gsap.set([".anim-input", ".anim-button"], { filter: "blur(6px)" });
        window.gsap.set([".anim-carousel"], { filter: "blur(9px)" });

        // Release CSS "js" gating right when we animate in
        document.documentElement.classList.remove("js");

        const flow = [
          ".anim-logo",
          ".anim-title",
          "#name-input.anim-input",
          "#email-input.anim-input",
          ".anim-button",
          ".anim-launch",
          ".anim-carousel"
        ];

        window.gsap.to(flow, {
          autoAlpha: 1,
          y: 0,
          filter: "blur(0px)",
          duration: 0.6,
          ease: "power3.out",
          stagger: 0.07,
          force3D: true
        });
      } else {
        // Reduced motion: just reveal immediately after selection
        document.documentElement.classList.remove("js");
      }
    }
  </script>

</body>
</html>
